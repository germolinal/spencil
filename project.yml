name: Spencil
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SpencilCore:
    path: SpencilCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple ID team here (or in Xcode > Signing & Capabilities) to run on a device.
    DEVELOPMENT_TEAM: ""
targets:
  Spencil:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SpencilCore
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: Spencil
        NSCameraUsageDescription: Spencil uses the camera to see your paper and overlay your reference image on it.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spencil
        TARGETED_DEVICE_FAMILY: "1,2"
  SpencilMac:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: SpencilCore
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: Spencil
        NSCameraUsageDescription: Spencil uses the camera to see your paper and overlay your reference image on it.
        LSApplicationCategoryType: public.app-category.graphics-design
    entitlements:
      path: Support/SpencilMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_NAME: Spencil
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spencil.mac
        CODE_SIGN_IDENTITY: "-"
